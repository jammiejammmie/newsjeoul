[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# 오전 9시 KST = 00:00 UTC
[functions."update-news"]
  schedule = "0 0 * * *"

[functions."update-elections"]
  schedule = "0 0 * * *"

# 오후 9시 KST = 12:00 UTC
[functions."update-news-evening"]
  schedule = "0 12 * * *"

[functions."update-elections-evening"]
  schedule = "0 12 * * *"

# 매일 오전 6시 KST = 21:00 UTC (전날)
[functions."update-youtube"]
  schedule = "0 21 * * *"

# 타임아웃 설정
[functions."fetch-comparisons-kr"]
  timeout = 30

[functions."fetch-election-kr"]
  timeout = 30

[functions."update-youtube"]
  timeout = 60
