# netlify.toml - 뉴스저울 배포 설정

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "index.html,election.html,admin.html"
  SECRETS_SCAN_OMIT_KEYS = "SECRETS_SCAN_OMIT_PATHS"

# 매일 오전 9시 (UTC / 한국 오후 6시) — 뉴스 비교 자동 생성
[functions."fetch-comparisons-kr"]
  schedule = "0 9 * * *"

# 매일 오전 10시 (UTC / 한국 오후 7시) — 선거 뉴스 분석
[functions."fetch-election-kr"]
  schedule = "0 10 * * *"

[[redirects]]
  from = "http://newsjeoul.co.kr/*"
  to = "https://newsjeoul.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.newsjeoul.co.kr/*"
  to = "https://newsjeoul.co.kr/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
