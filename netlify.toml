[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 오전 9시 KST = 00:00 UTC
[functions."update-news"]
  schedule = "0 0 * * *"

[functions."update-elections"]
  schedule = "0 0 * * *"

# 오후 9시 KST = 12:00 UTC
[functions."update-news-evening"]
  schedule = "0 12 * * *"

[functions."update-elections-evening"]
  schedule = "0 12 * * *"
