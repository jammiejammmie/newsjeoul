<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 비교 — 뉴스저울</title>
<meta name="description" content="보수 vs 진보 유튜브 채널 비교. 가로세로연구소, 신의한수 vs 김어준, 매불쇼 — 누가 더 많이 봤나">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://newsjeoul.co.kr/youtube.html">
<meta property="og:title" content="유튜브 비교 — 뉴스저울">
<meta property="og:description" content="보수 vs 진보 유튜브 채널 최신 영상 비교">
<meta property="og:image" content="https://newsjeoul.co.kr/og-image.png">
<meta property="og:site_name" content="뉴스저울">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--bg2:#101010;--card:#141414;--card2:#1a1a1a;
  --border:#1e1e1e;--border2:#2a2a2a;
  --con:#e63946;--lib:#2563eb;
  --con-soft:rgba(230,57,70,.08);--lib-soft:rgba(37,99,235,.08);
  --gold:#f59e0b;--green:#10b981;--purple:#8b5cf6;
  --text:#f0f0e8;--text2:#b8b8b0;--muted:#555;--muted2:#333;
}
[data-theme="light"]{
  --bg:#f5f4ef;--bg2:#eeede8;--card:#fff;--card2:#f9f8f4;
  --border:#e0dfd8;--border2:#ccc;
  --con:#c0392b;--lib:#1d4ed8;
  --text:#1a1a14;--text2:#444;--muted:#888;--muted2:#ccc;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;font-size:15px;padding-bottom:80px}
.nav{background:rgba(8,8,8,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;padding:0 20px;gap:10px}
[data-theme="light"] .nav{background:rgba(245,244,239,.96)}
.nav-logo{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--text);text-decoration:none;flex-shrink:0}
.nav-logo .c{color:var(--con)}.nav-logo .l{color:var(--lib)}
.nav-links{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav-link{color:var(--muted);text-decoration:none;font-size:11px;padding:5px 8px;border-radius:8px;transition:all .15s}
.nav-link:hover,.nav-link.active{color:var(--text);background:var(--card)}
.nav-election{background:var(--con);color:#fff !important;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

.hero{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:28px}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hero-title{font-family:'Noto Serif KR',serif;font-size:clamp(20px,3.5vw,34px);line-height:1.35;margin-bottom:8px}
.hero-sub{font-size:12px;color:var(--text2);line-height:1.8;margin-bottom:14px}
.share-row{display:flex;gap:8px;flex-wrap:wrap}
.share-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:opacity .15s;color:#fff}
.share-btn:hover{opacity:.82}
.share-thread{background:#000;border:1px solid #333}
.share-x{background:#111;border:1px solid #444}
.share-copy{background:var(--card);color:var(--text);border:1px solid var(--border2)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.section-title.con::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--con)}
.section-title.lib::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--lib)}
.updated-badge{font-size:10px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:20px}

/* SPLIT LAYOUT */
.yt-split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
@media(max-width:700px){.yt-split{grid-template-columns:1fr}}

.yt-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.yt-col-title{font-size:13px;font-weight:700}
.yt-col-title.con{color:var(--con)}
.yt-col-title.lib{color:var(--lib)}
.yt-col-share{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;color:#fff;transition:opacity .15s}
.yt-col-share:hover{opacity:.82}
.yt-col-share.con{background:var(--con)}
.yt-col-share.lib{background:var(--lib)}

.yt-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;transition:transform .2s}
.yt-card:hover{transform:translateY(-2px)}
.yt-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg2);display:block}
.yt-thumb-placeholder{width:100%;aspect-ratio:16/9;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:32px}
.yt-info{padding:12px 14px}
.yt-channel{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.yt-channel-thumb{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--bg2)}
.yt-channel-name{font-size:11px;font-weight:700;color:var(--text2)}
.yt-subs{font-size:10px;color:var(--muted)}
.yt-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:6px}
.yt-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yt-date{font-size:10px;color:var(--muted)}
.yt-watch{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;text-decoration:none;display:inline-block}
.yt-watch.con{background:var(--con-soft);color:var(--con);border:1px solid rgba(230,57,70,.2)}
.yt-watch.lib{background:var(--lib-soft);color:var(--lib);border:1px solid rgba(37,99,235,.2)}

.loading{padding:40px 20px;text-align:center;color:var(--muted)}
.spinner{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--con);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:10px 20px;font-size:13px;color:var(--text);opacity:0;transition:all .25s;z-index:300;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="/">⚖️ 뉴스<span class="c">저</span><span class="l">울</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">메인</a>
    <a href="/election.html" class="nav-link nav-election">🗳️ 선거</a>
    <a href="/youtube.html" class="nav-link active">📺 유튜브</a>
    <a href="/media101.html" class="nav-link">📖 미디어101</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="hero-eyebrow">유튜브 채널 비교</div>
    <h1 class="hero-title">보수 vs 진보 유튜브,<br>오늘은 뭘 다뤘나요?</h1>
    <p class="hero-sub">가로세로연구소, 신의한수 vs 김어준, 매불쇼 — 같은 날 어떤 콘텐츠를 올렸는지 나란히 비교합니다.</p>
    <div class="share-row">
      <button class="share-btn share-thread" onclick="sharePage('thread')">스레드 공유</button>
      <button class="share-btn share-x" onclick="sharePage('x')">𝕏 공유</button>
      <button class="share-btn share-copy" onclick="sharePage('copy')">🔗 링크 복사</button>
    </div>
  </div>

  <div class="yt-split">
    <!-- 보수 -->
    <div>
      <div class="yt-col-header">
        <div class="section-title con">🔴 보수 유튜브</div>
        <button class="yt-col-share con" onclick="shareCol('con')">보수채널 공유</button>
      </div>
      <div id="conChannels">
        <div class="loading"><div class="spinner"></div>불러오는 중...</div>
      </div>
    </div>
    <!-- 진보 -->
    <div>
      <div class="yt-col-header">
        <div class="section-title lib">🔵 진보 유튜브</div>
        <button class="yt-col-share lib" onclick="shareCol('lib')">진보채널 공유</button>
      </div>
      <div id="libChannels">
        <div class="loading"><div class="spinner"></div>불러오는 중...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://xlxztrnpmzklbnyfkrze.supabase.co';
const SUPABASE_KEY='sb_publishable_RYLor2fbXqj4aHhSW0vCsw_7ZfP2a58';

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('nj_theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'☀️':'🌙';
}
const saved=localStorage.getItem('nj_theme')||'dark';
document.documentElement.setAttribute('data-theme',saved);
document.getElementById('themeBtn').textContent=saved==='dark'?'☀️':'🌙';

function formatSubs(n){
  if(!n) return '';
  if(n>=10000000) return Math.floor(n/10000000)+'천만';
  if(n>=1000000) return Math.floor(n/100000)/10+'백만';
  if(n>=10000) return Math.floor(n/10000)+'만';
  return n.toLocaleString();
}

async function loadChannels(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/youtube_channels?select=*&order=subscriber_count.desc`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const data=await res.json();
    if(!data||data.length===0){
      document.getElementById('conChannels').innerHTML='<div class="loading">채널 데이터 준비 중입니다.</div>';
      document.getElementById('libChannels').innerHTML='<div class="loading">채널 데이터 준비 중입니다.</div>';
      return;
    }
    const con=data.filter(c=>c.lean==='conservative');
    const lib=data.filter(c=>c.lean==='liberal');
    renderChannels(con,'con');
    renderChannels(lib,'lib');
  }catch(e){
    console.error(e);
  }
}

function renderChannels(channels, lean){
  const html=channels.map(ch=>`
    <div class="yt-card">
      ${ch.latest_video_thumbnail
        ?`<img class="yt-thumb" src="${ch.latest_video_thumbnail}" alt="${ch.latest_video_title||''}" loading="lazy">`
        :`<div class="yt-thumb-placeholder">📺</div>`}
      <div class="yt-info">
        <div class="yt-channel">
          ${ch.thumbnail_url?`<img class="yt-channel-thumb" src="${ch.thumbnail_url}" alt="${ch.channel_name}">`:''}
          <div>
            <div class="yt-channel-name">${ch.channel_name}</div>
            ${ch.subscriber_count?`<div class="yt-subs">구독자 ${formatSubs(ch.subscriber_count)}명</div>`:''}
          </div>
        </div>
        <div class="yt-title">${ch.latest_video_title||'최신 영상 없음'}</div>
        <div class="yt-meta">
          <div class="yt-date">${ch.latest_video_date||''}</div>
          ${ch.latest_video_id
            ?`<a class="yt-watch ${lean}" href="https://youtube.com/watch?v=${ch.latest_video_id}" target="_blank">▶ 보기</a>`
            :`<a class="yt-watch ${lean}" href="https://youtube.com/channel/${ch.channel_id}" target="_blank">채널 보기</a>`}
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById(lean==='con'?'conChannels':'libChannels').innerHTML=html;
}

function sharePage(type){
  const url='https://newsjeoul.co.kr/youtube.html';
  const text='보수 vs 진보 유튜브 채널 비교 — 오늘은 뭘 다뤘나요? 뉴스저울에서 확인하세요.';
  if(type==='thread') window.open('https://www.threads.net/intent/post?text='+encodeURIComponent(text+'\n'+url),'_blank');
  else if(type==='x') window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url),'_blank');
  else { navigator.clipboard.writeText(url).then(()=>showToast('🔗 링크 복사됨!')); }
}

function shareCol(lean){
  const url='https://newsjeoul.co.kr/youtube.html';
  const text=lean==='con'
    ?'보수 유튜브 오늘 영상 — 가로세로연구소, 신의한수 등 최신 콘텐츠\n뉴스저울 → '+url
    :'진보 유튜브 오늘 영상 — 김어준, 매불쇼 등 최신 콘텐츠\n뉴스저울 → '+url;
  window.open('https://www.threads.net/intent/post?text='+encodeURIComponent(text),'_blank');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

loadChannels();
</script>
</body>
</html>
