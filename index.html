<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스저울 — 같은 뉴스, 다른 시각</title>
<meta name="description" content="조중동 vs 한경오. 같은 사건, 다른 시각. 보수와 진보 언론이 같은 뉴스를 어떻게 다르게 보도하는지 뉴스저울이 나란히 보여줍니다.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://newsjeoul.co.kr/">
<!-- OG -->
<meta property="og:type" content="website">
<meta property="og:title" content="뉴스저울 — 같은 뉴스, 다른 시각">
<meta property="og:description" content="조중동 vs 한경오. 같은 사건, 다른 시각. 대한민국 언론의 좌우 온도차를 숫자로 보여주는 뉴스 비교 플랫폼">
<meta property="og:url" content="https://newsjeoul.co.kr/">
<meta property="og:image" content="https://newsjeoul.co.kr/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="뉴스저울">
<meta property="og:locale" content="ko_KR">
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="뉴스저울 — 같은 뉴스, 다른 시각">
<meta name="twitter:description" content="조중동 vs 한경오. 같은 사건, 다른 시각. 대한민국 언론의 좌우 온도차를 숫자로 보여줍니다.">
<meta name="twitter:image" content="https://newsjeoul.co.kr/og-image.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--bg2:#101010;--card:#141414;--card2:#1a1a1a;
  --border:#1e1e1e;--border2:#2a2a2a;
  --con:#e63946;--lib:#2563eb;
  --con-soft:rgba(230,57,70,.08);--lib-soft:rgba(37,99,235,.08);
  --gold:#f59e0b;--green:#10b981;
  --text:#f0f0e8;--text2:#b8b8b0;--muted:#555;
}
[data-theme="light"]{
  --bg:#f5f4ef;--bg2:#eeede8;--card:#fff;--card2:#f9f8f4;
  --border:#e0dfd8;--border2:#ccc;
  --con:#c0392b;--lib:#1d4ed8;
  --text:#1a1a14;--text2:#444;--muted:#888;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;font-size:15px;padding-bottom:80px}

/* NAV */
.nav{background:rgba(8,8,8,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px}
[data-theme="light"] .nav{background:rgba(245,244,239,.96)}
.nav-logo{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--text);text-decoration:none}
.nav-logo .c{color:var(--con)}.nav-logo .l{color:var(--lib)}
.nav-links{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav-link{color:var(--muted);text-decoration:none;font-size:12px;padding:6px 10px;border-radius:8px;transition:all .15s}
.nav-link:hover,.nav-link.active{color:var(--text);background:var(--card)}
.nav-election{background:var(--con);color:#fff !important;font-size:11px;font-weight:700;padding:5px 12px;border-radius:8px}
.nav-election:hover{opacity:.85;background:var(--con) !important}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0}

/* WRAP */
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* HERO */
.hero{padding:36px 0 28px;border-bottom:1px solid var(--border);margin-bottom:28px}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.hero-title{font-family:'Noto Serif KR',serif;font-size:clamp(24px,4vw,40px);line-height:1.35;margin-bottom:12px}
.hero-title .c{color:var(--con)}.hero-title .l{color:var(--lib)}
.hero-sub{font-size:13px;color:var(--text2);line-height:1.8;max-width:560px}

/* ELECTION BANNER */
.election-banner{background:linear-gradient(135deg,var(--con-soft),var(--lib-soft));border:1px solid var(--border2);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.election-banner-left{display:flex;align-items:center;gap:16px}
.dday-chip{font-family:'Bebas Neue',cursive;font-size:36px;color:var(--gold);line-height:1;flex-shrink:0}
.election-banner-text{font-size:13px;color:var(--text2);line-height:1.7}
.election-banner-text strong{color:var(--text);font-size:14px;display:block;margin-bottom:2px}
.election-banner-btn{background:var(--con);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;text-decoration:none;display:inline-block;flex-shrink:0}
.election-banner-btn:hover{opacity:.85}

/* SECTION */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--con)}
.updated-badge{font-size:10px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:20px}

/* NEWS CARD */
.news-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:transform .2s,box-shadow .2s}
.news-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.news-card-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.news-card-title{font-size:14px;font-weight:700;color:var(--text);flex:1;line-height:1.4}
.cat-tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:20px;flex-shrink:0}
.cat-정치{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.2);color:var(--con)}
.cat-경제{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--gold)}
.cat-사회{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:var(--green)}
.cat-국제{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);color:#8b5cf6}
.news-card-body{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:580px){.news-card-body{grid-template-columns:1fr}}
.news-side{padding:14px 18px}
.news-side.con{border-right:1px solid var(--border);background:var(--con-soft)}
.news-side.lib{background:var(--lib-soft)}
.side-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.side-label.con{color:var(--con)}.side-label.lib{color:var(--lib)}
.side-outlet{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px}
.side-headline{font-size:13px;font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.4}
.side-summary{font-size:12px;color:var(--text2);line-height:1.7}
.news-card-footer{padding:10px 18px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.bias-label{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.bias-track{flex:1;height:5px;background:var(--border2);border-radius:20px;overflow:hidden}
.bias-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--lib),var(--con))}

/* LOADING / EMPTY */
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--con);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:10px 20px;font-size:13px;color:var(--text);opacity:0;transition:all .25s;z-index:300;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">⚖️ 뉴스<span class="c">저</span><span class="l">울</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link active">메인</a>
    <a href="/election.html" class="nav-link nav-election">🗳️ 선거특집</a>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
</nav>

<div class="wrap">

  <div class="hero">
    <div class="hero-eyebrow">뉴스저울 — 대한민국 미디어 편향 분석 플랫폼</div>
    <h1 class="hero-title">같은 뉴스, <span class="c">조중동</span>과 <span class="l">한경오</span>는<br>어떻게 다르게 보도할까요</h1>
    <p class="hero-sub">같은 사건을 두고 보수와 진보 언론이 어떻게 다른 시각으로 보도하는지 매일 정리합니다. 어느 쪽이 맞다는 게 아니라, 두 시각을 모두 보여드립니다.</p>
  </div>

  <!-- 선거 배너 -->
  <div class="election-banner">
    <div class="election-banner-left">
      <div class="dday-chip" id="bannerDday">D-?</div>
      <div class="election-banner-text">
        <strong>🗳️ 6·3 지방선거 & 국회의원 보궐선거</strong>
        같은 후보, 언론사마다 다른 여론조사. 최대 10%p 차이 — 어느 언론이 의뢰했는지가 결과를 바꿉니다.
      </div>
    </div>
    <a href="/election.html" class="election-banner-btn">선거 특집 보기 →</a>
  </div>

  <!-- 오늘의 뉴스 비교 -->
  <div class="section-header">
    <div class="section-title">오늘의 뉴스 비교</div>
    <div class="updated-badge" id="updatedBadge">불러오는 중...</div>
  </div>

  <div id="newsContainer">
    <div class="loading">
      <div class="spinner"></div>
      최신 뉴스를 불러오는 중입니다
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://xlxztrnpmzklbnyfkrze.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RYLor2fbXqj4aHhSW0vCsw_7ZfP2a58';

// 테마
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nj_theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}
const saved = localStorage.getItem('nj_theme') || 'dark';
document.documentElement.setAttribute('data-theme', saved);
document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';

// D-DAY
const election = new Date('2026-06-03');
const today = new Date();
const diff = Math.ceil((election - today) / 86400000);
document.getElementById('bannerDday').textContent = diff > 0 ? 'D-' + diff : diff === 0 ? 'D-DAY' : '종료';

// 뉴스 불러오기
async function loadNews() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/news_kr?select=*&order=created_at.desc&limit=10`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      }
    );
    const data = await res.json();

    if (!data || data.length === 0) {
      showEmpty();
      return;
    }

    // 업데이트 시간 표시
    const latest = new Date(data[0].created_at);
    const h = latest.getHours().toString().padStart(2, '0');
    const m = latest.getMinutes().toString().padStart(2, '0');
    document.getElementById('updatedBadge').textContent =
      `${latest.getMonth() + 1}/${latest.getDate()} ${h}:${m} 업데이트`;

    renderNews(data);
  } catch (e) {
    console.error(e);
    showEmpty();
  }
}

function renderNews(items) {
  const html = items.map(item => `
    <div class="news-card">
      <div class="news-card-header">
        <div class="news-card-title">${item.title}</div>
        <div class="cat-tag cat-${item.category || '정치'}">${item.category || '정치'}</div>
      </div>
      <div class="news-card-body">
        <div class="news-side con">
          <div class="side-label con">🔴 보수 시각</div>
          <div class="side-outlet">${item.conservative_outlet || '조선일보'}</div>
          <div class="side-headline">${item.conservative_headline || ''}</div>
          <div class="side-summary">${item.conservative_summary || ''}</div>
        </div>
        <div class="news-side lib">
          <div class="side-label lib">🔵 진보 시각</div>
          <div class="side-outlet">${item.liberal_outlet || '한겨레'}</div>
          <div class="side-headline">${item.liberal_headline || ''}</div>
          <div class="side-summary">${item.liberal_summary || ''}</div>
        </div>
      </div>
      <div class="news-card-footer">
        <div class="bias-label">진보</div>
        <div class="bias-track">
          <div class="bias-fill" style="width:${item.bias_score || 50}%"></div>
        </div>
        <div class="bias-label">보수</div>
      </div>
    </div>
  `).join('');
  document.getElementById('newsContainer').innerHTML = html;
}

function showEmpty() {
  document.getElementById('updatedBadge').textContent = '준비 중';
  document.getElementById('newsContainer').innerHTML = `
    <div class="empty">
      오늘의 뉴스가 아직 준비 중입니다.<br>
      매일 오전 9시, 오후 9시에 업데이트됩니다.
    </div>`;
}

loadNews();
</script>
</body>
</html>
